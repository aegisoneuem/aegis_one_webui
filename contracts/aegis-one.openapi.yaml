openapi: 3.1.0
info:
  title: Aegis One API
  version: 0.1.0-draft
  summary: Contract between the Aegis One console and its backend (Go service or mock server).
  description: |
    Single source of truth for the console API. The Go team implements this document; the mock
    server in apps/aegis-one/mock-server implements the same document. Switching between them is
    one environment variable on the console, VITE_API_BASE_URL.

    Conventions
    - Base path /api/v1. JSON only, UTF-8, ISO 8601 UTC timestamps.
    - Authentication: 15 minute bearer JWT. Refresh token lives in an httpOnly, Secure,
      SameSite=Strict cookie. Every state-changing request also carries X-CSRF-Token.
    - Every operation declares x-required-permission. The server returns 403 when the caller's
      role lacks it; the UI hides the same actions from the same permission table.
    - Unknown request properties are rejected with 400 (additionalProperties: false throughout).
    - List endpoints are cursor paginated (limit max 200), support server-side filter, sort and
      search, and honour ?fields= projection. No endpoint returns the full fleet.
    - Remote script execution is a non-interactive job: submit, poll, fetch per-endpoint output.
      There is no session, socket or interactive channel anywhere in this API.
    - Errors use one envelope (Error).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: http://localhost:8080/api/v1
  description: Mock server (local)
