          $ref: '#/components/responses/NotFound'
  /audit:
    get:
      tags:
      - administration
      operationId: listAuditLog
      summary: Audit log of administrative and operational actions.
      x-required-permission: audit:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
  /licensing:
    get:
      tags:
      - licensing
      operationId: getLicense
      summary: Plan, seats, term and modules.
      x-required-permission: licensing:read
      responses:
        '200':
          description: License
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
  /licensing/file:
    put:
      tags:
      - licensing
      operationId: uploadLicense
      summary: Upload a license file. The signature is verified server-side.
      x-required-permission: licensing:write
      x-csrf: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '400':
          $ref: '#/components/responses/BadRequest'
  /diagnostics/health:
    get:
      tags:
      - diagnostics
      operationId: getHealth
      summary: System health, services and events of the last 24 hours.
      x-required-permission: diagnostics:read
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /diagnostics/health-check:
    post:
      tags:
      - diagnostics
      operationId: runHealthCheck
      summary: Run Health Check.
      x-required-permission: diagnostics:run
      x-csrf: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /diagnostics/bundle:
    post:
      tags:
      - diagnostics
      operationId: createDiagnosticBundle
      summary: Build the server-side diagnostic bundle. Poll the returned export.
      x-required-permission: diagnostics:run
      x-csrf: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
  /search:
    get:
      tags:
      - search
      operationId: globalSearch
      summary: Global search across devices, software, deployments, findings and groups. Results are filtered to
        what the caller may read.
      x-required-permission: overview:read
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 128
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated projection of top-level fields. Unknown fields are rejected.
      schema:
        type: string
        maxLength: 1024
        pattern: ^[A-Za-z][A-Za-z0-9_]*(,[A-Za-z][A-Za-z0-9_]*)*$
    Q:
      name: q
      in: query
      required: false
      description: Free-text search.
      schema:
        type: string
        maxLength: 128
    ZoneFilter:
      name: zone
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    DestinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              enum:
              - bad_request
              - unauthorized
              - forbidden
              - not_found
              - conflict
              - payload_too_large
              - rate_limited
              - internal
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - path
                - message
                properties:
                  path:
                    type: string
                  message:
                    type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - nextCursor
      - total
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          minimum: 0
          description: Count matching the filter.
    Job:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - createdAt
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - completed-with-failures
      - failed
      - cancelled
    EndpointJobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - timed-out
      - cancelled
      - offline
    Severity:
      type: string
      enum:
      - critical
      - high
      - medium
      - low
    PlatformFamily:
      type: string
      enum:
      - windows
      - macos
      - linux
      - aix
    Framework:
      type: string
      enum:
      - cis
      - stig
      - pci-dss
      - hipaa
    ExportFormat:
      type: string
      enum:
      - csv
      - xlsx
      - pdf
      - html
    ExportRequest:
      type: object
      additionalProperties: false
      required:
      - format
      properties:
        format:
          $ref: '#/components/schemas/ExportFormat'
        columns:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 64
        q:
          type: string
          maxLength: 128
        filter:
          type: string
          maxLength: 4096
        sort:
          type: string
          maxLength: 64
    Export:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - ready
          - failed
        format:
          $ref: '#/components/schemas/ExportFormat'
        downloadUrl:
          type:
          - string
          - 'null'
          description: Short-lived signed path; absent until ready.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - at
      - actor
      - action
      - target
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        ip:
          type: string
        outcome:
          type: string
          enum:
          - success
          - denied
          - failed
    AuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    Role:
      type: string
      enum:
      - Super Admin
      - Admin
      - Operator
      - Auditor
      - Read-only
    Session:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds. 900 for the 15 minute access token.
        user:
          $ref: '#/components/schemas/Me'
    Me:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - email
      - role
      - permissions
      - mfaEnrolled
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
        mfaEnrolled:
          type: boolean
    Overview:
      type: object
      additionalProperties: false
      required:
      - counts
      - health
      - patchCompliance
      - securityPosture
      - deploymentStatus
      - expiring
      - attention
      - recentActivity
      - updatedAt
      properties:
        counts:
          type: object
          additionalProperties: false
          required:
          - managedEndpoints
          - online
          - deviceGroups
          - softwarePackages
          - patchUpdates
          - deployments
          - zones
          properties:
            managedEndpoints:
              type: integer
            online:
              type: integer
            deviceGroups:
              type: integer
            softwarePackages:
              type: integer
            patchUpdates:
              type: integer
            deployments:
              type: integer
            zones:
              type: integer
            highRiskEndpoints:
              type: integer
        health:
          type: object
          additionalProperties: false
          required:
          - score
          - band
          - measures
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
            band:
              type: string
              enum:
              - healthy
              - fair
              - poor
            measures:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - label
                - weight
                - score
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  weight:
                    type: number
                  score:
                    type: integer
        patchCompliance:
          type: object
          additionalProperties: false
          required:
          - compliantPct
          - compliant
          - nonCompliant
          - missingBySeverity
          - lastInstall
          - byOs
          properties:
            compliantPct:
              type: integer
            compliant:
              type: integer
            nonCompliant:
              type: integer
            missingBySeverity:
              type: object
              additionalProperties: false
              properties:
                critical:
                  type: integer
                high:
                  type: integer
                medium:
                  type: integer
                low:
                  type: integer
            lastInstall:
              type: object
              additionalProperties: false
              properties:
                successful:
                  type: integer
                restartNeeded:
                  type: integer
                pending:
                  type: integer
                failed:
                  type: integer
            byOs:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - family
                - compliantPct
                properties:
                  family:
                    $ref: '#/components/schemas/PlatformFamily'
                  compliantPct:
                    type: integer
        securityPosture:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - control
            - protected
            - total
            properties:
              control:
                type: string
                enum:
                - disk-encryption
                - antivirus
                - firewall
              protected:
                type: integer
              total:
                type: integer
        deploymentStatus:
          type: object
          additionalProperties: false
          properties:
            completed:
              type: integer
            queuedOrScheduled:
              type: integer
            running:
              type: integer
            failed:
              type: integer
            paused:
              type: integer
        expiring:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - name
            - expiresAt
            properties:
              kind:
                type: string
                enum:
                - enrollment-token
                - api-token
                - certificate
                - license
              name:
                type: string
              expiresAt:
                type: string
                format: date-time
        attention:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - severity
            - count
            - title
            - detail
            - action
            properties:
              id:
                type: string
              severity:
                type: string
                enum:
                - high
                - medium
                - low
              count:
                type: integer
              title:
                type: string
              detail:
                type: string
              action:
                type: string
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentSummary'
        updatedAt:
          type: string
          format: date-time
    OverviewLayout:
      type: object
      additionalProperties: false
      required:
      - preset
      - widgets
      properties:
        preset:
          type: string
          maxLength: 64
          description: For example "Endpoint Operations".
        widgets:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - type
            - visible
            properties:
              id:
                type: string
                maxLength: 64
              type:
                type: string
                maxLength: 64
              visible:
                type: boolean
              chartType:
                type: string
                enum:
                - donut
                - pie
                - column
                - bar
                - rings
              view:
                type: string
                maxLength: 64
              title:
                type: string
                maxLength: 80
    SetupChecklist:
      type: object
      additionalProperties: false
      required:
      - steps
      properties:
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - label
            - done
            properties:
              id:
                type: string
                enum:
                - create-administrator
                - enroll-first-endpoint
                - configure-zone
                - run-vulnerability-scan
              label:
                type: string
              done:
                type: boolean
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - os
      - status
      - zone
      description: Inventory record. The ColumnDef catalogue lists all 80 columns; fields not requested via ?fields=
        are omitted.
      properties:
        id:
          type: string
        name:
          type: string
          description: Computer name, for example PC-BLR-103.
        os:
          type: string
        osVersion:
          type: string
        osBuild:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformFamily'
        architecture:
          type: string
        ipAddress:
          type: string
        hostname:
          type: string
        macAddress:
          type: string
        dnsName:
          type: string
        dnsServer:
          type: string
        zone:
          type: string
        location:
          type: string
        user:
          type: string
        department:
          type: string
        status:
          type: string
          enum:
          - online
          - offline
        lastSeen:
          type: string
          format: date-time
        computerType:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        processor:
          type: string
        ramGb:
          type: integer
        lastBoot:
          type: string
          format: date-time
        agentVersion:
          type: string
        missingPatches:
          type: integer
        antivirus:
          type: string
        diskEncryption:
          type: string
        firewall:
          type: string
        risk:
          type: string
          enum:
          - low
          - medium
          - high
        extra:
          type: object
          description: Remaining inventory columns keyed by ColumnDef.id.
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
    DevicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        page:
          $ref: '#/components/schemas/PageInfo'
    DevicesSummary:
      type: object
      additionalProperties: false
      required:
      - all
      - online
      - offline
      - locations
      properties:
        all:
          type: integer
        online:
          type: integer
        offline:
          type: integer
        locations:
          type: integer
    ColumnDef:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - type
      - sortable
      - filterable
      - defaultVisible
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
          - string
          - number
          - boolean
          - date
          - enum
        required:
          type: boolean
        sortable:
          type: boolean
        filterable:
          type: boolean
        defaultVisible:
          type: boolean
        values:
          type: array
          items:
            type: string
    SavedViewInput:
      type: object
      additionalProperties: false
      required:
      - name
      - columns
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        columns:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 64
        filter:
          type: string
          maxLength: 4096
        sort:
          type: string
          maxLength: 64
    SavedView:
      allOf:
      - $ref: '#/components/schemas/SavedViewInput'
      - type: object
        required:
        - id
        - owner
        properties:
          id:
            type: string
          owner:
            type: string
    DeviceDiagnostics:
      type: object
      additionalProperties: false
      required:
      - deviceId
      - agentVersion
      - lastCheckIn
      - services
      - recentJobs
      properties:
        deviceId:
          type: string
        agentVersion:
          type: string
        lastCheckIn:
          type: string
          format: date-time
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - state
            properties:
              name:
                type: string
              state:
                type: string
                enum:
                - running
                - stopped
                - degraded
        recentJobs:
          type: array
          items:
            $ref: '#/components/schemas/LiveJob'
    GroupInput:
      type: object
      additionalProperties: false
      required:
      - name
      - kind
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum:
          - static
          - dynamic
        parentId:
          type:
          - string
          - 'null'
        rule:
          type: string
          maxLength: 4096
          description: Advanced-filter JSON for dynamic groups.
        memberIds:
          type: array
          maxItems: 5000
          items:
            type: string
    Group:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - members
      - subGroups
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - static
          - dynamic
        parentId:
          type:
          - string
          - 'null'
        members:
          type: integer
        online:
          type: integer
        offline:
          type: integer
        missingPatches:
          type: integer
        subGroups:
          type: integer
    GroupDetail:
      allOf:
      - $ref: '#/components/schemas/Group'
      - type: object
        properties:
          rule:
            type: string
          policies:
            type: array
            items:
              type: string
          history:
            type: array
            items:
              $ref: '#/components/schemas/AuditEntry'
    GroupsSummary:
      type: object
      additionalProperties: false
      required:
      - groups
      - subGroups
      - grouped
      - notGrouped
      properties:
        groups:
          type: integer
        subGroups:
          type: integer
        grouped:
          type: integer
        notGrouped:
          type: integer
    EnrollmentSummary:
      type: object
      additionalProperties: false
      required:
      - enrolled
      - online
      - onLatestAgent
      - latestAgentVersion
      - activeTokens
      - totalTokens
      - notCheckingIn
      - byPlatform
      - installCommands
      - methods
      properties:
        enrolled:
          type: integer
        online:
          type: integer
          description: Enrolled endpoints checking in right now.
        onLatestAgent:
          type: integer
        latestAgentVersion:
          type: string
          description: The newest agent release the estate is measured against.
        activeTokens:
          type: integer
        totalTokens:
          type: integer
          description: Active, expired and revoked together.
        notCheckingIn:
          type: integer
          description: Enrolled but not seen for seven days or more.
        byPlatform:
          type: object
          additionalProperties: false
          properties:
            windows:
              type: integer
            macos:
              type: integer
            linux:
              type: integer
        installCommands:
          type: object
          additionalProperties: false
          properties:
            windows:
              type: string
            macos:
              type: string
            linux:
              type: string
        methods:
          description: The ways an endpoint can be enrolled, and the state of each.
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - description
            - state
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              state:
                type: string
                enum:
                - ready
                - configured
                - available
                - not-configured
    EnrollmentTokenInput:
      type: object
      additionalProperties: false
      required:
      - name
      - expiresAt
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        targetGroupId:
          type:
          - string
          - 'null'
        expiresAt:
