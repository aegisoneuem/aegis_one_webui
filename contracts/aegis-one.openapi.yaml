paths:
  /auth/oidc/authorize:
    get:
      tags:
      - auth
      operationId: oidcAuthorize
      summary: Start the OIDC authorization-code flow (PKCE). Redirects to the identity provider.
      security: []
      parameters:
      - name: redirect_to
        in: query
        required: false
        description: Same-origin path to return to after sign-in. Absolute URLs are rejected.
        schema:
          type: string
          maxLength: 512
          pattern: ^/[^/\\].*$|^/$
      responses:
        '302':
          description: Redirect to the identity provider
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/oidc/callback:
    get:
      tags:
      - auth
      operationId: oidcCallback
      summary: Receive the authorization code. Sets the refresh cookie or redirects to the MFA step.
      security: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          maxLength: 2048
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 512
      responses:
        '302':
          description: Redirect to the console (sign-in complete) or to /login/mfa
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/mfa/verify:
    post:
      tags:
      - auth
      operationId: mfaVerify
      summary: Verify the one-time code for a pending sign-in.
      security: []
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - challengeId
              - code
              properties:
                challengeId:
                  type: string
                  maxLength: 128
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: Signed in. Refresh cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshSession
      summary: Exchange the refresh cookie for a new access token. The refresh token rotates.
      security: []
      x-csrf: true
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: Revoke the refresh token and clear the cookie.
      x-csrf: true
      responses:
        '204':
          description: Signed out
  /auth/csrf:
    get:
      tags:
      - auth
      operationId: getCsrfToken
      summary: Issue a CSRF token for the current session.
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - csrfToken
                properties:
                  csrfToken:
                    type: string
  /me:
    get:
      tags:
      - auth
      operationId: getMe
      summary: Current user, role and effective permissions.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /overview:
    get:
      tags:
      - overview
      operationId: getOverview
      summary: Aggregates for the Overview page, server-computed.
      x-required-permission: overview:read
      parameters:
      - $ref: '#/components/parameters/ZoneFilter'
      - name: platform
        in: query
        schema:
          $ref: '#/components/schemas/PlatformFamily'
      - name: department
        in: query
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Overview aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '403':
          $ref: '#/components/responses/Forbidden'
  /overview/layout:
    get:
      tags:
      - overview
      operationId: getOverviewLayout
      summary: Saved widget layout and preset for the current user.
      x-required-permission: overview:read
      responses:
        '200':
          description: Layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewLayout'
    put:
      tags:
      - overview
      operationId: putOverviewLayout
      summary: Save widget layout (Customize, Custom Widget).
      x-required-permission: overview:read
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverviewLayout'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewLayout'
        '400':
          $ref: '#/components/responses/BadRequest'
  /setup/checklist:
    get:
      tags:
      - overview
      operationId: getSetupChecklist
      summary: First-run checklist (Create Administrator, Enroll First Endpoint, Configure Aegis Zone, Run Vulnerability
        Scan).
      x-required-permission: overview:read
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupChecklist'
  /devices:
    get:
      tags:
      - devices
      operationId: listDevices
      summary: Endpoint inventory. Server-side filter, sort, search and cursor paging.
      x-required-permission: devices:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Q'
      - name: sort
        in: query
        description: 'Column id, prefix with - for descending. Example: -lastSeen.'
        schema:
          type: string
          maxLength: 64
      - name: group
        in: query
        schema:
          type: string
          maxLength: 64
      - name: zone
        in: query
        schema:
          type: string
          maxLength: 64
      - name: platform
        in: query
        schema:
          $ref: '#/components/schemas/PlatformFamily'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - online
          - offline
      - name: filter
        in: query
        description: Advanced filter rules, JSON array of {field, op, value}, URL-encoded.
        schema:
          type: string
          maxLength: 4096
      responses:
        '200':
          description: A page of devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /devices/summary:
    get:
      tags:
      - devices
      operationId: getDevicesSummary
      summary: Counts for the Devices header (all, online, offline, locations).
      x-required-permission: devices:read
      parameters:
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesSummary'
  /devices/columns:
    get:
      tags:
      - devices
      operationId: listDeviceColumns
      summary: The 80 inventory column definitions (id, label, type, filterable, sortable, default visibility).
      x-required-permission: devices:read
      responses:
        '200':
          description: Column catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnDef'
  /devices/{deviceId}:
    get:
      tags:
      - devices
      operationId: getDevice
      summary: Full device record (identity, network, system, security and health).
      x-required-permission: devices:read
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
  /devices/{deviceId}/vulnerabilities:
    get:
      tags:
      - devices
      operationId: listDeviceVulnerabilities
      summary: Findings affecting one device.
      x-required-permission: vulns:read
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /devices/{deviceId}/diagnostics:
    get:
      tags:
      - devices
      operationId: getDeviceDiagnostics
      summary: Agent health, last check-in, recent job results and collected log bundles for one device.
      x-required-permission: diagnostics:read
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDiagnostics'
        '404':
          $ref: '#/components/responses/NotFound'
  /devices/views:
    get:
      tags:
      - devices
      operationId: listDeviceViews
      summary: Saved views (columns, filters, sort) for the current user.
      x-required-permission: devices:read
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
    post:
      tags:
      - devices
      operationId: createDeviceView
      summary: Save a view.
      x-required-permission: devices:read
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/BadRequest'
  /devices/views/{viewId}:
    delete:
      tags:
      - devices
      operationId: deleteDeviceView
      summary: Delete a saved view owned by the caller.
      x-required-permission: devices:read
      x-csrf: true
      parameters:
      - name: viewId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /devices/export:
    post:
      tags:
      - devices
      operationId: exportDevices
      summary: Start an export of the current view (CSV, PDF or HTML). Poll the returned export.
      x-required-permission: reports:export
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          $ref: '#/components/responses/BadRequest'
  /groups:
    get:
      tags:
      - groups
      operationId: listGroups
      summary: Device groups with sub-group counts and summary.
      x-required-permission: groups:read
      parameters:
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - summary
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  summary:
                    $ref: '#/components/schemas/GroupsSummary'
    post:
      tags:
      - groups
      operationId: createGroup
      summary: Create a static or rule-based group.
      x-required-permission: groups:write
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
  /groups/import:
    post:
      tags:
      - groups
      operationId: importGroups
      summary: Import groups from CSV.
      x-required-permission: groups:write
      x-csrf: true
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              maxLength: 1048576
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - created
                - skipped
                - errors
                properties:
                  created:
                    type: integer
                  skipped:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /groups/{groupId}:
    get:
      tags:
      - groups
      operationId: getGroup
      summary: Group detail incl. membership rule, policies and history.
      x-required-permission: groups:read
      parameters:
      - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - groups
      operationId: updateGroup
      summary: Edit a group.
      x-required-permission: groups:write
      x-csrf: true
      parameters:
      - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - groups
      operationId: deleteGroup
      summary: Delete a group (members are not deleted).
      x-required-permission: groups:write
      x-csrf: true
      parameters:
      - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{groupId}/members:
    get:
      tags:
      - groups
      operationId: listGroupMembers
      summary: Members of a group.
      x-required-permission: groups:read
      parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/directory-sync:
    post:
      tags:
      - groups
      operationId: runDirectorySync
      summary: Run directory sync against the configured identity source.
      x-required-permission: groups:write
      x-csrf: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /enrollment/summary:
    get:
      tags:
      - enrollment
      operationId: getEnrollmentSummary
      summary: Enrolled endpoints, agent currency, platform split and install commands.
      x-required-permission: enrollment:read
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentSummary'
  /enrollment/tokens:
    get:
      tags:
      - enrollment
      operationId: listEnrollmentTokens
      summary: Enrollment tokens. The secret is never returned after creation.
      x-required-permission: enrollment:read
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentToken'
    post:
      tags:
      - enrollment
      operationId: createEnrollmentToken
      summary: Create an enrollment token. The secret is returned once.
      x-required-permission: enrollment:write
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentTokenInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
  /enrollment/tokens/{tokenId}:
    delete:
      tags:
      - enrollment
      operationId: revokeEnrollmentToken
      summary: Revoke a token.
      x-required-permission: enrollment:write
      x-csrf: true
      parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
  /patches/summary:
    get:
      tags:
      - patches
      operationId: getPatchesSummary
      summary: Patch overview aggregates (compliance by OS, severity, age, top missing, sources).
      x-required-permission: patches:read
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchSummary'
  /patches:
    get:
      tags:
      - patches
      operationId: listPatches
      summary: Update catalogue (All Patches and the platform tabs).
      x-required-permission: patches:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Q'
      - name: platform
        in: query
        schema:
          $ref: '#/components/schemas/PlatformFamily'
      - name: category
        in: query
        schema:
          type: string
          enum:
          - os
          - third-party
          - driver-bios
      - name: severity
        in: query
        schema:
          $ref: '#/components/schemas/Severity'
      - name: approval
        in: query
        schema:
          type: string
          enum:
          - approved
          - test
          - review
          - declined
          - superseded
      - name: subcategory
        in: query
        schema:
          type: string
          enum:
          - bios
          - driver
      - name: vendor
        in: query
        description: Matches Patch.source.
        schema:
          type: string
          maxLength: 128
      - name: osVersion
        in: query
        description: Narrows to updates outstanding on endpoints running this OS version.
        schema:
          type: string
          maxLength: 64
      - name: releasedAfter
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Patches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchPage'
  /patches/{patchId}/approval:
    put:
      tags:
      - patches
      operationId: setPatchApproval
      summary: Approve, send to test, or decline an update.
      x-required-permission: patches:deploy
      x-csrf: true
      parameters:
      - name: patchId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - approval
              properties:
                approval:
                  type: string
                  enum:
                  - approved
                  - test
                  - review
                  - declined
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patch'
        '404':
          $ref: '#/components/responses/NotFound'
  /patch-policies:
    get:
      tags:
      - patches
      operationId: listPatchPolicies
      summary: Patch policies.
      x-required-permission: patches:read
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatchPolicy'
  /software:
    get:
      tags:
      - software
      operationId: listSoftware
      summary: Software catalogue.
      x-required-permission: software:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Q'
      - name: category
        in: query
        schema:
          type: string
          maxLength: 64
      - name: publisher
        in: query
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwarePage'
    post:
      tags:
      - software
      operationId: createSoftwarePackage
      summary: Add a package definition.
